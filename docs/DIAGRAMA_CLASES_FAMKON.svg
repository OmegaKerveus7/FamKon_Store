<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
  <defs>
    <linearGradient id="head" x1="0" x2="1"><stop offset="0" stop-color="#082B63"/><stop offset="1" stop-color="#0C65AD"/></linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#315A86"/></marker>
    <filter id="shadow"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#082B63" flood-opacity=".16"/></filter>
    <style>
      .title{font:700 30px 'Segoe UI',Arial,sans-serif;fill:#fff}.ct{font:700 17px 'Segoe UI',Arial,sans-serif;fill:#082B63}.txt{font:400 13px 'Segoe UI',Arial,sans-serif;fill:#26364D}.rel{stroke:#315A86;stroke-width:2.3;fill:none;marker-end:url(#arrow)}.label{font:600 12px 'Segoe UI',Arial,sans-serif;fill:#5B6472}
    </style>
  </defs>
  <rect width="1400" height="900" fill="#F7F9FC"/>
  <rect width="1400" height="74" fill="url(#head)"/><rect y="70" width="1400" height="4" fill="#F4BD18"/>
  <text x="700" y="45" text-anchor="middle" class="title">FAMKON STORE — DIAGRAMA DE CLASES PRINCIPALES</text>

  <!-- Usuario -->
  <g transform="translate(45 150)"><rect width="250" height="190" rx="10" fill="#EAF2FB" stroke="#8FB5D9" filter="url(#shadow)"/><rect width="250" height="42" rx="10" fill="#D5E8F8"/><text x="125" y="28" text-anchor="middle" class="ct">Usuario</text><path d="M0 42H250" stroke="#8FB5D9"/><text x="18" y="68" class="txt">+ idUsuario</text><text x="18" y="91" class="txt">+ correo</text><text x="18" y="114" class="txt">+ nickname</text><text x="18" y="137" class="txt">+ activo / bloqueado</text><path d="M0 151H250" stroke="#8FB5D9"/><text x="18" y="174" class="txt">+ iniciarSesion()</text></g>
  <g transform="translate(370 150)"><rect width="250" height="190" rx="10" fill="#EAF2FB" stroke="#8FB5D9" filter="url(#shadow)"/><rect width="250" height="42" rx="10" fill="#D5E8F8"/><text x="125" y="28" text-anchor="middle" class="ct">Rol</text><path d="M0 42H250" stroke="#8FB5D9"/><text x="18" y="68" class="txt">+ idRol</text><text x="18" y="91" class="txt">+ codigo</text><text x="18" y="114" class="txt">+ nombre</text><path d="M0 128H250" stroke="#8FB5D9"/><text x="18" y="151" class="txt">+ asignarPermiso()</text><text x="18" y="174" class="txt">+ administrarUsuarios()</text></g>
  <g transform="translate(695 150)"><rect width="250" height="190" rx="10" fill="#EAF2FB" stroke="#8FB5D9" filter="url(#shadow)"/><rect width="250" height="42" rx="10" fill="#D5E8F8"/><text x="125" y="28" text-anchor="middle" class="ct">Permiso</text><path d="M0 42H250" stroke="#8FB5D9"/><text x="18" y="68" class="txt">+ idPermiso</text><text x="18" y="91" class="txt">+ codigo</text><text x="18" y="114" class="txt">+ modulo</text><path d="M0 128H250" stroke="#8FB5D9"/><text x="18" y="151" class="txt">+ autorizarOperacion()</text></g>

  <!-- Commerce -->
  <g transform="translate(45 450)"><rect width="250" height="190" rx="10" fill="#FFF8DF" stroke="#E6C34C" filter="url(#shadow)"/><rect width="250" height="42" rx="10" fill="#FFF0B2"/><text x="125" y="28" text-anchor="middle" class="ct">Producto</text><path d="M0 42H250" stroke="#E6C34C"/><text x="18" y="68" class="txt">+ idProducto</text><text x="18" y="91" class="txt">+ sku / nombre</text><text x="18" y="114" class="txt">+ precioBase</text><text x="18" y="137" class="txt">+ existencia</text><path d="M0 151H250" stroke="#E6C34C"/><text x="18" y="174" class="txt">+ actualizarStock()</text></g>
  <g transform="translate(370 450)"><rect width="250" height="190" rx="10" fill="#FFF8DF" stroke="#E6C34C" filter="url(#shadow)"/><rect width="250" height="42" rx="10" fill="#FFF0B2"/><text x="125" y="28" text-anchor="middle" class="ct">Carrito</text><path d="M0 42H250" stroke="#E6C34C"/><text x="18" y="68" class="txt">+ idCarrito</text><text x="18" y="91" class="txt">+ estado</text><text x="18" y="114" class="txt">+ fechaModificacion</text><path d="M0 128H250" stroke="#E6C34C"/><text x="18" y="151" class="txt">+ agregarProducto()</text><text x="18" y="174" class="txt">+ convertirEnPedido()</text></g>
  <g transform="translate(695 450)"><rect width="250" height="190" rx="10" fill="#FFF8DF" stroke="#E6C34C" filter="url(#shadow)"/><rect width="250" height="42" rx="10" fill="#FFF0B2"/><text x="125" y="28" text-anchor="middle" class="ct">Personalizacion</text><path d="M0 42H250" stroke="#E6C34C"/><text x="18" y="68" class="txt">+ ladoA / ladoB</text><text x="18" y="91" class="txt">+ mensaje</text><text x="18" y="114" class="txt">+ configuracionJSON</text><path d="M0 128H250" stroke="#E6C34C"/><text x="18" y="151" class="txt">+ prepararDiseño()</text></g>
  <g transform="translate(1020 450)"><rect width="250" height="190" rx="10" fill="#EEF8F5" stroke="#9AD4C3" filter="url(#shadow)"/><rect width="250" height="42" rx="10" fill="#D7F0E9"/><text x="125" y="28" text-anchor="middle" class="ct">Pedido</text><path d="M0 42H250" stroke="#9AD4C3"/><text x="18" y="68" class="txt">+ idPedido / numero</text><text x="18" y="91" class="txt">+ estado</text><text x="18" y="114" class="txt">+ subtotal / total</text><path d="M0 128H250" stroke="#9AD4C3"/><text x="18" y="151" class="txt">+ crear()</text><text x="18" y="174" class="txt">+ cambiarEstado()</text></g>

  <!-- Payment / delivery -->
  <g transform="translate(1020 150)"><rect width="250" height="190" rx="10" fill="#EEF8F5" stroke="#9AD4C3" filter="url(#shadow)"/><rect width="250" height="42" rx="10" fill="#D7F0E9"/><text x="125" y="28" text-anchor="middle" class="ct">Pago</text><path d="M0 42H250" stroke="#9AD4C3"/><text x="18" y="68" class="txt">+ idPago</text><text x="18" y="91" class="txt">+ monto</text><text x="18" y="114" class="txt">+ estado</text><path d="M0 128H250" stroke="#9AD4C3"/><text x="18" y="151" class="txt">+ registrar()</text></g>
  <g transform="translate(1020 715)"><rect width="250" height="145" rx="10" fill="#EEF8F5" stroke="#9AD4C3" filter="url(#shadow)"/><rect width="250" height="42" rx="10" fill="#D7F0E9"/><text x="125" y="28" text-anchor="middle" class="ct">Entrega</text><path d="M0 42H250" stroke="#9AD4C3"/><text x="18" y="68" class="txt">+ repartidor / area</text><text x="18" y="91" class="txt">+ estado / intento</text><path d="M0 105H250" stroke="#9AD4C3"/><text x="18" y="128" class="txt">+ registrarResultado()</text></g>

  <!-- Relations -->
  <path d="M295 245H370" class="rel"/><text x="310" y="233" class="label">asigna</text>
  <path d="M620 245H695" class="rel"/><text x="637" y="233" class="label">contiene</text>
  <path d="M170 340V450" class="rel"/><text x="184" y="402" class="label">compra</text>
  <path d="M295 545H370" class="rel"/><text x="309" y="533" class="label">usa</text>
  <path d="M620 545H695" class="rel"/><text x="637" y="533" class="label">personaliza</text>
  <path d="M945 545H1020" class="rel"/><text x="956" y="533" class="label">genera</text>
  <path d="M1145 340V450" class="rel"/><text x="1158" y="402" class="label">paga</text>
  <path d="M1145 640V715" class="rel"/><text x="1158" y="681" class="label">entrega</text>
  <text x="700" y="835" text-anchor="middle" style="font:400 14px 'Segoe UI',Arial,sans-serif;fill:#5B6472">Relaciones representadas sobre las entidades principales de la API y la base de datos Oracle.</text>
</svg>
