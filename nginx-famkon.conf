# /etc/nginx/sites-available/famkon.site
# Copia este archivo y haz: sudo ln -s /etc/nginx/sites-available/famkon.site /etc/nginx/sites-enabled/
# Luego: sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name famkon.site www.famkon.site;

    # Redirigir HTTP a HTTPS (Certbot lo hace automáticamente)
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name famkon.site www.famkon.site;

    # Certificados SSL (Certbot los gestiona)
    ssl_certificate /etc/letsencrypt/live/famkon.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/famkon.site/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Root del frontend (build de Vite: bun run build → dist/)
    root /var/www/famkon.site/dist;
    index index.html;

    # Logs
    access_log /var/log/nginx/famkon.site.access.log;
    error_log /var/log/nginx/famkon.site.error.log;

    # ─── PROXY API AL BACKEND (puerto 5299) ──────────────────────────────
    location /api/ {
        proxy_pass http://localhost:5299/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 86400;
    }

    # ─── FRONTEND (React SPA) ────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
        
        # Cache para assets estáticos (JS, CSS, imágenes con hash)
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "strict-origin-when-cross-origin";
}