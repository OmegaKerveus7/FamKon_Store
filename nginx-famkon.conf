# /etc/nginx/sites-available/famkon.site
# Copia este archivo y haz: sudo ln -s /etc/nginx/sites-available/famkon.site /etc/nginx/sites-enabled/
# Luego: sudo nginx -t && sudo systemctl reload nginx

# ─── ZONAS DE LÍMITE ANTI-DDOS (contexto http) ─────────────────────────
# Se cuentan por IP real del cliente. Un ataque desde una sola IP se frena
# aquí, antes de llegar al backend (que ademas tiene sus propios limites).
limit_req_zone $binary_remote_addr zone=famkon_api:16m rate=20r/s;
limit_req_zone $binary_remote_addr zone=famkon_web:16m rate=40r/s;
limit_conn_zone $binary_remote_addr zone=famkon_conexiones:16m;

server {
    listen 80;
    listen [::]:80;
    server_name famkon.site www.famkon.site;

    # Redirigir HTTP a HTTPS (Certbot lo hace automáticamente)
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name famkon.site www.famkon.site;

    # Certificados SSL (Certbot los gestiona)
    ssl_certificate /etc/letsencrypt/live/famkon.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/famkon.site/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # ─── TOPES GENERALES ────────────────────────────────────────────────
    # Cuerpos grandes solo para las fotos del registro (el API acepta 10 MB).
    client_max_body_size 10m;
    # Cabeceras y cuerpo lentos: se cortan antes de que ocupen una conexión.
    client_header_timeout 15s;
    client_body_timeout 30s;
    send_timeout 30s;
    keepalive_timeout 30s;
    keepalive_requests 100;
    # Conexiones simultáneas por IP y respuestas 429 al pasarse.
    limit_conn famkon_conexiones 25;
    limit_req_status 429;
    limit_conn_status 429;

    # Root del frontend (build de Vite: bun run build → dist/)
    root /var/www/famkon.site/dist;
    index index.html;

    # Logs
    access_log /var/log/nginx/famkon.site.access.log;
    error_log /var/log/nginx/famkon.site.error.log;

    # ─── PROXY API AL BACKEND (puerto 5299) ──────────────────────────────
    location /api/ {
        # 20 peticiones por segundo y por IP (con ráfaga de 40): el catálogo
        # y las imágenes siguen bien, un flooded no pasa.
        limit_req zone=famkon_api burst=40 nodelay;
        limit_conn famkon_conexiones 10;

        proxy_pass http://localhost:5299/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        # El acceso facial puede tardar hasta un minuto: 120 s deja margen
        # sin dejar la conexión abierta indefinidamente.
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
    }

    # ─── FRONTEND (React SPA) ────────────────────────────────────────────
    location / {
        limit_req zone=famkon_web burst=80 nodelay;
        try_files $uri $uri/ /index.html;
        
        # Cache para assets estáticos (JS, CSS, imágenes con hash)
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "strict-origin-when-cross-origin";
}
